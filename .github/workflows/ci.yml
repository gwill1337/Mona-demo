name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  secret_scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python lint, type checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group ci

      - name: Mypy type check
        run: uv run mypy mona_core/

      - name: Ruff lint
        run: uv run ruff check mona_core/

      - name: Ruff format check
        run: uv run ruff format --check mona_core/
      
      - name: pytest
        run: uv run pytest tests/
